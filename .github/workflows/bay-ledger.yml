# Refreshes the fallback copy inside the Bay Ledger dashboard every day and publishes that one page to GitHub Pages.
# It commits nothing and touches no tariff page. It runs only from the default branch, and it can publish only
# once Pages is set to "GitHub Actions" under Settings > Pages.
name: Bay Ledger
on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bay-ledger
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p site
      - run: node tools/refresh-bay-ledger.mjs bay-area-spending.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
